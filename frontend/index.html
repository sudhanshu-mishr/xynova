
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xynova | Write. Learn. Instantly.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --apple-black: #000000;
            --apple-white: #ffffff;
            --xynova-teal: #00d4ff;
            --apple-gray: #f5f5f7;
            --glass-bg: rgba(255, 255, 255, 0.7);
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            background-color: var(--apple-white);
            color: var(--apple-black);
            overflow-x: hidden;
            cursor: auto;
        }
        .apple-blur {
            backdrop-filter: saturate(180%) blur(20px);
            background: rgba(255, 255, 255, 0.75);
        }
        .hero-text {
            letter-spacing: -0.03em;
            line-height: 1.0;
        }
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        #cursor-follower {
            position: fixed;
            width: 28px;
            height: 28px;
            border: 1px solid rgba(0, 212, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease;
            transform: translate(-50%, -50%);
        }

        .hover-active #cursor-follower {
            transform: translate(-50%, -50%) scale(2.5);
            background-color: rgba(0, 212, 255, 0.05);
            border-color: var(--xynova-teal);
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .shimmer {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react/": "https://esm.sh/react@19.0.0/",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/": "https://esm.sh/react-dom@19.0.0/",
    "react-router-dom": "https://esm.sh/react-router-dom@7.1.1?deps=react@19.0.0,react-dom@19.0.0",
    "framer-motion": "https://esm.sh/framer-motion@11.11.11?deps=react@19.0.0",
    "lucide-react": "https://esm.sh/lucide-react@0.462.0?deps=react@19.0.0",
    "three": "https://esm.sh/three@0.170.0",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@9.0.0-rc.0?deps=react@19.0.0,three@0.170.0",
    "@react-three/drei": "https://esm.sh/@react-three/drei@9.121.3?deps=react@19.0.0,@react-three/fiber@9.0.0-rc.0,three@0.170.0",
    "gsap": "https://esm.sh/gsap@3.12.5",
    "gsap/ScrollTrigger": "https://esm.sh/gsap/ScrollTrigger",
    "clsx": "https://esm.sh/clsx@2.1.1",
    "tailwind-merge": "https://esm.sh/tailwind-merge@2.5.4",
    "gsap/": "https://esm.sh/gsap@^3.14.2/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="cursor-follower"></div>
    <div id="root"></div>
    <script>
        const follower = document.getElementById('cursor-follower');
        document.addEventListener('mousemove', (e) => {
            follower.style.left = e.clientX + 'px';
            follower.style.top = e.clientY + 'px';
        });
        document.addEventListener('mouseover', (e) => {
            if (e.target.closest('a') || e.target.closest('button')) {
                document.body.classList.add('hover-active');
            }
        });
        document.addEventListener('mouseout', (e) => {
            if (e.target.closest('a') || e.target.closest('button')) {
                document.body.classList.remove('hover-active');
            }
        });
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
